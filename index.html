<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column, app-like screens, dark ink + anodized-bronze accent */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --sunk:#ECEDEE; --line:#C9CDD1; --line-soft:#DCDFE2;
  --ink:#1B1F24; --muted:#5A626B; --accent:#7A4E22; --accent-ink:#FFFFFF; --accent-soft:#F6ECE1; --accent-soft-ink:#5C3A18;
  --primary:#1B1F24; --primary-ink:#FFFFFF; --danger:#A1271F; --danger-soft:#FBE9E7; --danger-line:#E8C4C0;
  --info:#1F5E8C; --info-soft:#E5EFF7; --ok:#2E6B3F; --ok-soft:#E4F1E7;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181B; --surface:#1F2327; --sunk:#2A2F34; --line:#3E454C; --line-soft:#32383E;
  --ink:#ECEEF0; --muted:#A3ABB3; --accent:#D69A5E; --accent-ink:#1B1308; --accent-soft:#3A2B1C; --accent-soft-ink:#F0CDA8;
  --primary:#ECEEF0; --primary-ink:#15181B; --danger:#F08A80; --danger-soft:#3D2220; --danger-line:#6B3934;
  --info:#8EC2EA; --info-soft:#1C2E3D; --ok:#8FD3A1; --ok-soft:#1D3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1F2327; --sunk:#2A2F34; --line:#3E454C; --line-soft:#32383E;
  --ink:#ECEEF0; --muted:#A3ABB3; --accent:#D69A5E; --accent-ink:#1B1308; --accent-soft:#3A2B1C; --accent-soft-ink:#F0CDA8;
  --primary:#ECEEF0; --primary-ink:#15181B; --danger:#F08A80; --danger-soft:#3D2220; --danger-line:#6B3934;
  --info:#8EC2EA; --info-soft:#1C2E3D; --ok:#8FD3A1; --ok-soft:#1D3324; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:800}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card.flat{border:1px solid var(--line-soft)}
.logo-wrap{display:block;width:240px;max-width:100%}
.logo-wrap.sm{width:150px}
.logo-wrap img{width:100%;height:auto;display:block}
.lg-d{display:none !important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none !important}:root:not([data-theme="light"]) .lg-d{display:block !important}}
:root[data-theme="dark"] .lg-l{display:none !important}
:root[data-theme="dark"] .lg-d{display:block !important}
label{font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=email],input[type=date],input[type=number],input[inputmode],select{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);width:100%;box-sizing:border-box;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.numrow{display:flex;align-items:center;gap:10px}
.numrow > label{flex:1;min-width:0}
.unitbox{display:flex;align-items:center;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;gap:6px;width:158px;flex-shrink:0;box-sizing:border-box;background:var(--surface)}
.unitbox input{border:0 !important;height:44px !important;padding:0 !important;text-align:right;background:transparent !important}
.unitbox b{font-size:14px;white-space:nowrap}
.hint{font-weight:500;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{box-sizing:border-box;height:52px;border:0;border-radius:14px;background:var(--primary);color:var(--primary-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-decoration:none;width:100%}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn.sm{height:44px;width:auto;font-size:14px;border-radius:12px;padding:0 14px}
.btn:disabled{opacity:.55;cursor:default}
.back{align-self:flex-start;display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--accent);background:none;border:0;padding:10px 0;min-height:44px}
.icon-btn{width:44px;height:44px;border:1px solid var(--danger-line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--danger)}
.edit-btn{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:700}
.seg{display:grid;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{height:40px;border:0;border-radius:9px;font-size:14px;font-weight:700;background:transparent;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.chip{font-size:12px;font-weight:700;color:var(--info);background:var(--info-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:8px;padding:4px 10px}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.big-link{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border-radius:20px;padding:22px 20px;border:0;width:100%}
.big-link.dark{background:var(--primary);color:var(--primary-ink)}
.big-link.light{background:var(--surface);color:var(--ink);border:1px solid var(--line-soft);flex-direction:column;align-items:stretch;gap:14px;padding:20px}
.big-title{font-size:19px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;font-size:13px}
.kv span{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv em{font-style:normal;color:var(--muted)}
.kv strong{font-size:14px;overflow-wrap:anywhere}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 16px}
.list-item .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.list-item .txt strong{overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-shrink:0}
.piece{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase}
.proj-head{background:var(--primary);color:var(--primary-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.proj-head .sub{font-size:13px;opacity:.8}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px;font-variant-numeric:tabular-nums}
.totals .grand{font-weight:800;font-size:17px}
.overlay{position:fixed;inset:0;background:rgba(10,12,14,.55);display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-left,0px));z-index:20}
.dialog{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 20px 20px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.calc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.price{font-variant-numeric:tabular-nums;font-weight:800}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

let lang="fr";
const t=(k,l)=>{const d=T[l||lang]||T.fr;return d[k]!==undefined?d[k]:(T.fr[k]!==undefined?T.fr[k]:k)};

/* ================= MOTEUR DE CALCUL (CALC-START) ================= */
const IN_PER_MM=1/25.4, FT_PER_M=1/0.3048, LBFT_PER_KGM=0.3048/0.45359237, FT2_PER_M2=1/(0.3048*0.3048);
function num(v){if(v===null||v===undefined)return null;const s=String(v).trim().replace(/\s/g,"").replace(",",".");if(s==="")return null;const n=Number(s);return Number.isFinite(n)?n:null}
function pos(v){const n=num(v);return n!==null&&n>0?n:0}
/* Arrondi au cent le plus proche, 0,5 cent vers le haut, protégé contre les erreurs de virgule flottante */
function roundCents(x){return Math.round(Number((x*100).toPrecision(12)))/100}
/* Pièce ramenée aux unités de calcul: po, pi, lb/pi, pi² */
function toCalcUnits(p){
  const met=p.sys==="met";
  const L=num(p.longueur), S=num(p.surface), W=num(p.poids), P=num(p.perimetre);
  return {
    L: L===null?null:(met?L*FT_PER_M:L),
    S: S===null?null:(met?S*FT2_PER_M2:S),
    W: W===null?null:(met?W*LBFT_PER_KGM:W),
    P: P===null?null:(met?P*IN_PER_MM:P)
  };
}
function extraMatches(x,v){
  const a=num(x.a), b=num(x.b);
  if(v===null||v===undefined)return false;
  /* Arrondi à 6 décimales pour qu'une conversion métrique (ex. 5,4864 m = 18 pi) tombe pile sur la borne */
  v=Math.round(v*1e6)/1e6;
  /* Borne basse incluse, borne haute exclue : 12 ou moins = moins de 12; de 12 à 18 = 12 à 17,999…; 18 ou plus = 18 et plus */
  if(x.cond==="plus")return a!==null&&v>=a;
  if(x.cond==="moins")return a!==null&&v<a;
  return a!==null&&b!==null&&v>=Math.min(a,b)&&v<Math.max(a,b);
}
/* Retourne {ok, err, kind, price, ...détails pour la ligne de calcul} */
const NONE="__none__";
/* Prix d'une pièce = matériel (prix vendant, par pièce) + procédé calculé. Les minimums et extras touchent seulement le procédé. */
function pricePiece(p,store){
  const mat=num(p.matPrix), hasMat=mat!==null&&mat>0;
  if(p.procedeId===NONE){
    if(!hasMat)return {ok:false,err:"errNoMat"};
    const m=roundCents(mat);
    return {ok:true,kind:"none",price:m,procPrice:0,matPrice:m,c:toCalcUnits(p)};
  }
  const r0=priceProcess(p,store);
  if(!r0.ok)return r0;
  r0.procPrice=r0.price; r0.matPrice=hasMat?roundCents(mat):0;
  r0.price=roundCents(r0.procPrice+r0.matPrice);
  return r0;
}
function priceProcess(p,store){
  const proc=store.procedes.find(x=>x.id===p.procedeId);
  if(!proc)return {ok:false,err:"errProc"};
  const r=store.regles||{};
  const c=toCalcUnits(p);
  const hasL=c.L!==null&&c.L>0, hasS=c.S!==null&&c.S>0;
  if(hasL&&hasS)return {ok:false,err:"errDims"};
  if(!hasL&&!hasS)return {ok:false,err:"errNoDims"};
  const minPiece=pos(r.minPiece);
  if(hasS){
    const pp=num(proc.prixPi2);
    if(pp===null||pp<=0)return {ok:false,err:"errPricePi2"};
    const raw=pp*c.S, rounded=roundCents(raw);
    let price=rounded, minKind=null, minVal=0;
    if(minPiece>0&&rounded<minPiece){price=minPiece;minKind="piece";minVal=minPiece}
    return {ok:true,kind:"feuille",price,raw,rounded,pp,S:c.S,minKind,minVal,c};
  }
  const pn=num(proc.prixNormal);
  if(pn===null||pn<=0)return {ok:false,err:"errPriceNormal"};
  if(c.P===null||c.P<=0)return {ok:false,err:"errPerim"};
  const perimMin=pos(r.perimMin);
  const perimUsed=(perimMin>0&&c.P<perimMin)?perimMin:c.P;
  const base=pn*perimUsed*c.L;
  const poidsTotal=c.W!==null?c.W*c.L:null;
  let sumDollar=0,sumPct=0;const applied=[];
  for(const x of (store.extras||[])){
    const v=x.critere==="poids"?poidsTotal:c.L;
    if(extraMatches(x,v)){
      const m=num(x.montant)||0;
      if(x.mode==="pct")sumPct+=m;else sumDollar+=m;
      applied.push({nom:x.nom,mode:x.mode,montant:m});
    }
  }
  const raw=base+sumDollar+base*sumPct/100;
  const rounded=roundCents(raw);
  const minProc=pos(r.minProcede), tank=pos(p.qteBassin);
  const minTank=(minProc>0&&tank>0)?roundCents(minProc/tank):0;
  const minAll=Math.max(minPiece,minTank);
  let price=rounded,minKind=null,minVal=0;
  if(minAll>0&&rounded<minAll){price=minAll;minVal=minAll;minKind=(minTank>=minPiece)?"tank":"piece"}
  return {ok:true,kind:"extrusion",price,raw,rounded,base,pn,perimUsed,perimOrig:c.P,perimMinApplied:perimUsed!==c.P,L:c.L,poidsTotal,applied,sumDollar,sumPct,minKind,minVal,minProc,tank,c};
}
/* Tri naturel: chiffres d'abord, puis lettres */
function naturalCompare(a,b){
  const sa=String(a||"").trim(), sb=String(b||"").trim();
  const da=/^\d/.test(sa)?0:1, dbb=/^\d/.test(sb)?0:1;
  if(da!==dbb)return da-dbb;
  return sa.localeCompare(sb,undefined,{numeric:true,sensitivity:"base"});
}
/* Groupes par procédé avec sous-total, lot minimum et total */
function buildReport(store){
  const pieces=(store.projet&&store.projet.pieces)||[];
  const r=store.regles||{};const minProc=pos(r.minProcede);
  const groups=[];
  const procs=store.procedes.map(x=>({proc:x,none:false})).concat([{proc:{id:NONE,nom:""},none:true}]);
  for(const {proc,none} of procs){
    const items=pieces.filter(p=>p.procedeId===proc.id).map(p=>({p,res:pricePiece(p,store)})).filter(x=>x.res.ok);
    if(!items.length)continue;
    items.sort((x,y)=>naturalCompare(x.p.numClient,y.p.numClient));
    let sub=0,procSub=0;
    for(const it of items){const q=num(it.p.qteRequise)||0;it.line=roundCents(it.res.price*q);it.procLine=roundCents(it.res.procPrice*q);sub=roundCents(sub+it.line);procSub=roundCents(procSub+it.procLine)}
    /* Lot minimum : comparé au total des procédés seulement (sans le matériel), si le procédé contient au moins une extrusion */
    const hasExt=!none&&items.some(it=>it.res.kind==="extrusion");
    const lot=(hasExt&&minProc>0&&procSub<minProc)?roundCents(minProc-procSub):0;
    groups.push({proc,none,items,sub,procSub,lot,total:roundCents(sub+lot)});
  }
  const grand=roundCents(groups.reduce((s,g)=>s+g.total,0));
  const invalid=pieces.filter(p=>!pricePiece(p,store).ok);
  return {groups,grand,invalid};
}
/* (CALC-END) */

const LOGO=(sm)=>`<span class="logo-wrap${sm?" sm":""}"><img class="lg-l" src="${LOGO_L}" alt="MAS - Montreal Aluminum Solutions inc."><img class="lg-d" src="${LOGO_D}" alt="MAS - Montreal Aluminum Solutions inc."></span>`;

let S={screen:"login",draft:{},msg:null,overlay:null,busy:false,editId:null,exp:{lang:"fr",mode:"piece"}};
let caps={downloads:null};
function go(screen,extra){S=Object.assign(S,{screen,msg:null,overlay:null},extra||{});render();window.scrollTo(0,0)}
function setMsg(kind,key,raw){S.msg={kind,text:raw||t(key)};render()}
const back=(to)=>`<button class="back" data-act="go" data-to="${to}">${ICON.back}${esc(t(to==="home"?"home":to==="project"?"projectName":to==="settings"?"settings":to==="rules"?"rules":to==="procs"?"processes":"home"))}</button>`;
function backLabel(to){return {home:t("home"),project:(store.projet&&store.projet.nom)||t("projectName"),settings:t("settings"),rules:t("rules"),mats:t("material"),procs:t("processes")}[to]||t("home")}
const backBtn=to=>`<button class="back" data-act="go" data-to="${to}">${ICON.back}${esc(backLabel(to))}</button>`;
const msgBox=()=>S.msg?`<div class="msg ${S.msg.kind}" role="status">${esc(S.msg.text)}</div>`:"";
const inp=(k,label,opts={})=>`<div class="field"><div class="row between"><label for="f-${k}">${label}</label></div><input id="f-${k}" data-k="${k}" type="${opts.type||"text"}" ${opts.inputmode?`inputmode="${opts.inputmode}"`:""} value="${esc(S.draft[k])}" placeholder="${esc(opts.ph||"")}" autocomplete="${opts.ac||"off"}"></div>`;
const numInp=(k,label,unit,opts={})=>`<div class="numrow"><label for="f-${k}">${label}${opts.hint?` <span class="hint">${esc(opts.hint)}</span>`:""}</label><span class="unitbox"><input id="f-${k}" data-k="${k}" type="text" inputmode="decimal" value="${esc(S.draft[k])}" placeholder="${esc(opts.ph||"0")}"><b id="u-${k}">${esc(unit)}</b></span></div>`;
const seg=(act,cur,items,cols)=>`<div class="seg" style="grid-template-columns:repeat(${cols||items.length},minmax(0,1fr))">${items.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur===v}">${esc(l)}</button>`).join("")}</div>`;

/* ================= ÉCRANS ================= */
function vLogin(){
  const d=S.draft;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:28px">${LOGO()}<div style="text-align:center;display:flex;flex-direction:column;gap:6px"><h1>${esc(t("appName"))}</h1><p class="muted">${esc(t("loginIntro"))}</p></div></div>
  <form class="card" data-form="login" novalidate>
    ${inp("name",t("name"),{ac:"name"})}
    ${inp("email",t("email"),{type:"email",ac:"email",ph:"nom@entreprise.ca"})}
    <div class="field"><label for="f-lang">${esc(t("language"))}</label><select id="f-lang" data-k="lang">${LANGS.map(([v,l])=>`<option value="${v}" ${d.lang===v?"selected":""}>${l}</option>`).join("")}</select></div>
    ${msgBox()}
    <button class="btn" type="submit">${esc(t("enter"))}</button>
  </form>
  <p class="muted small" style="text-align:center">${esc(t("loginNote"))}</p>`;
}
function vHome(){
  const p=store.projet;
  return `<div class="row between">${LOGO(true)}<button class="back" data-act="logout" style="padding:10px 4px">${esc(t("changeUser"))}</button></div>
  <div><p class="muted">${esc(t("hello"))}</p><h1>${esc(store.lastUser.name)}</h1></div>
  <button class="big-link dark" data-act="newProject"><span style="display:flex;flex-direction:column;gap:4px"><span class="big-title">${esc(t("newProject"))}</span><span style="font-size:14px;opacity:.75">${esc(t("replacesLast"))}</span></span>${ICON.plus}</button>
  ${p?`<button class="big-link light" data-act="go" data-to="project"><span class="row between" style="width:100%"><span class="big-title">${esc(t("openLast"))}</span>${ICON.chev}</span>
    <span class="kv"><span><em>${esc(t("client"))}</em><strong>${esc(p.client)}</strong></span><span><em>${esc(t("projectName"))}</em><strong>${esc(p.nom)}</strong></span><span><em>${esc(t("responsible"))}</em><strong>${esc(p.responsable||"-")}</strong></span><span><em>${esc(t("date"))}</em><strong>${esc(fmtDate(p.date))}</strong></span></span></button>`
   :`<div class="empty">${esc(t("noProject"))}</div>`}
  <button class="btn ghost" data-act="go" data-to="settings" style="margin-top:8px">${ICON.gear}${esc(t("settings"))}</button>`;
}
function vNewProject(){
  return `${backBtn("home")}<h1>${esc(t("newProject"))}</h1>
  <form class="card" data-form="project" novalidate>
    ${inp("client",t("client"))}
    ${inp("responsable",t("contact"))}
    ${inp("nom",t("projectName"))}
    <div class="field"><label for="f-date">${esc(t("date"))}</label><input id="f-date" data-k="date" type="date" value="${esc(S.draft.date)}"><span class="muted small">${esc(t("dateDefault"))}</span></div>
    ${msgBox()}
    <button class="btn" type="submit">${esc(t("createProject"))}</button>
  </form>`;
}
function vProject(){
  const p=store.projet;if(!p)return vHome();
  const pieces=p.pieces||[];
  const items=pieces.map(pc=>{const proc=store.procedes.find(x=>x.id===pc.procedeId);const res=pricePiece(pc,store);
    return `<div class="piece"><div class="row between" style="align-items:flex-start"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="eyebrow">${esc(pc.numClient||"-")}</span><strong style="font-size:16px;overflow-wrap:anywhere">${esc(pc.nom||"-")}</strong></span>
    <span class="actions"><button class="edit-btn" data-act="editPiece" data-id="${pc.id}">${esc(t("edit"))}</button><button class="icon-btn" aria-label="${esc(t("del"))}" data-act="askDel" data-kind="piece" data-id="${pc.id}">${ICON.trash}</button></span></div>
    <div class="row between"><span class="tag">${esc(pc.procedeId===NONE?t("noProcessOpt"):proc?proc.nom:"?")}</span><span class="muted">${esc(t("qtyReqShort"))} : <strong style="color:var(--ink)">${esc(pc.qteRequise||"-")}</strong></span></div>
    ${res.ok?"":`<div class="msg err">${esc(t(res.err))}</div>`}</div>`}).join("");
  return `${backBtn("home")}
  <div class="proj-head"><div><div class="sub">${esc(p.client)}</div><h1 style="font-size:23px">${esc(p.nom)}</h1></div><div class="row between sub" style="flex-wrap:wrap"><span>${esc(t("responsible"))} : ${esc(p.responsable||"-")}</span><span>${esc(fmtDate(p.date))}</span></div></div>
  <div class="row between"><h2 style="font-size:18px">${esc(t("pieces"))} <span class="muted" style="font-weight:600">(${pieces.length})</span></h2><button class="btn sm" data-act="newPiece">${ICON.plus}${esc(t("addPiece"))}</button></div>
  ${msgBox()}
  ${items||`<div class="empty">${esc(t("noPieces"))}</div>`}
  <button class="btn accent" data-act="go" data-to="export" style="margin-top:8px">${ICON.share}${esc(t("exportBtn"))}</button>`;
}
function vPiece(){
  const d=S.draft, met=d.sys==="met", u=t("u");
  const procOpts=`<option value="${NONE}" ${d.procedeId===NONE?"selected":""}>${esc(t("noProcessOpt"))}</option>`+store.procedes.map(x=>`<option value="${x.id}" ${d.procedeId===x.id?"selected":""}>${esc(x.nom)}</option>`).join("");
  return vPieceBody(d,met,u,procOpts);
}
function pieceBanner(){return S.fromMat?`<div class="msg info" role="status">${esc(t("matFound"))}</div>`:""}
function pieceBox(d){
  const res=d.procedeId?pricePiece(d,store):{ok:false};

function extraSummary(x){

const VIEWS={login:vLogin,home:vHome,newProject:vNewProject,project:vProject,piece:vPiece,settings:vSettings,procs:vProcs,rules:vRules,extra:vExtra,export:vExport,mats:vMats,mat:vMat};
function render(){
  document.documentElement.lang=lang;
  const a=document.activeElement, fid=a&&a.id&&a.tagName!=="BUTTON"?a.id:null;
  let sel=null;try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  document.getElementById("app").innerHTML=(VIEWS[S.screen]||vHome)();
  document.getElementById("overlay-root").innerHTML=vOverlay();
  if(fid){const el=document.getElementById(fid);if(el){try{el.focus({preventScroll:true});if(sel&&el.setSelectionRange)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

/* ================= ACTIONS ================= */
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.k){S.draft[el.dataset.k]=el.value}
  if(el.dataset.rule){store.regles[el.dataset.rule]=el.value;persist()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.k){S.draft[el.dataset.k]=el.value;if(el.id==="f-lang"){lang=el.value;render()}
    if(S.screen==="piece"){if(el.dataset.k==="numClient")lookupMat();refreshPiece()}}
  if(el.id==="restore"&&el.files&&el.files[0])restoreBackup(el.files[0]);
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  ({login:submitLogin,project:submitProject,piece:submitPiece,proc:submitProc,extra:submitExtra,mat:submitMat}[f]||(()=>{}))();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case "go":
      if(b.dataset.to==="export"){S.exp={lang:lang,mode:S.exp.mode||"piece"};if(!(store.projet&&store.projet.pieces.length)){setMsg("err","noPiecesExport");return}}
      if(b.dataset.to==="procs")S.draft={};
      go(b.dataset.to);break;
    case "logout": S.draft=Object.assign({},store.lastUser);go("login");break;
    case "newProject":
      S.draft={client:"",responsable:"",nom:"",date:todayISO()};go("newProject");break;
    case "doReplace": createProject();break;
    case "closeOverlay": S.overlay=null;render();break;
    case "newPiece":
      S.draft={sys:"imp",numClient:"",numDie:"",nom:"",qteRequise:"",procedeId:"",longueur:"",surface:"",poids:"",perimetre:"",qteBassin:"",matPrix:"",matId:""};go("piece",{editId:null,fromMat:false});break;
    case "editPiece":{const pc=store.projet.pieces.find(x=>x.id===id);if(!pc)return;S.draft=Object.assign({},pc);go("piece",{editId:id,fromMat:false});break}
    case "newMat": S.draft={sys:"imp",num:"",numDie:"",desc:"",longueur:"",surface:"",poids:"",perimetre:"",qteBassin:"",prix:""};go("mat",{editId:null});break;
    case "editMat":{const x=store.materiel.find(y=>y.id===id);if(!x)return;S.draft=Object.assign({},x);go("mat",{editId:id});break}
    case "sys": S.draft.sys=b.dataset.v;render();break;
    case "askDel":{
      let label="";
      if(b.dataset.kind==="piece"){const x=store.projet.pieces.find(y=>y.id===id);label=x?[x.numClient,x.nom].filter(Boolean).join(" · "):""}
      if(b.dataset.kind==="proc"){const x=store.procedes.find(y=>y.id===id);label=x?x.nom:""}
      if(b.dataset.kind==="extra"){const x=store.extras.find(y=>y.id===id);label=x?x.nom:""}
      if(b.dataset.kind==="mat"){const x=store.materiel.find(y=>y.id===id);label=x?[x.num,x.desc].filter(Boolean).join(" · "):""}
      S.overlay={kind:b.dataset.kind,id,label};render();break}
    case "doDel":{
      const o=S.overlay;
      if(o.kind==="piece")store.projet.pieces=store.projet.pieces.filter(x=>x.id!==o.id);
      if(o.kind==="proc")store.procedes=store.procedes.filter(x=>x.id!==o.id);
      if(o.kind==="extra")store.extras=store.extras.filter(x=>x.id!==o.id);
      if(o.kind==="mat")store.materiel=store.materiel.filter(x=>x.id!==o.id);
      persist();S.overlay=null;render();break}
    case "newProc": S.draft={_proc:true,nom:"",prixNormal:"",prixPi2:""};S.editId=null;S.msg=null;render();break;
    case "editProc":{const x=store.procedes.find(y=>y.id===id);S.draft=Object.assign({_proc:true},x);S.editId=id;S.msg=null;render();break}
    case "cancelProc": S.draft={};S.editId=null;S.msg=null;render();break;
    case "newExtra": S.draft={nom:"",critere:"longueur",cond:"entre",a:"",b:"",mode:"argent",montant:""};go("extra",{editId:null});break;
    case "editExtra":{const x=store.extras.find(y=>y.id===id);S.draft=Object.assign({},x);go("extra",{editId:id});break}
    case "crit": S.draft.critere=b.dataset.v;render();break;
    case "cond": S.draft.cond=b.dataset.v;render();break;
    case "mode": S.draft.mode=b.dataset.v;render();break;
    case "expLang": S.exp.lang=b.dataset.v;render();break;
    case "expMode": S.exp.mode=b.dataset.v;render();break;
    case "copy":{const txt=b.dataset.text;const done=()=>{b.textContent=t("copied")};
      try{navigator.clipboard.writeText(txt).then(done,()=>selectNear(b))}catch(err){selectNear(b)}break}
    case "pdf": makePdf();break;
    case "backup": saveBackup();break;
  }
});
function selectNear(b){const s=b.parentElement.querySelector("strong");if(!s)return;const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
function submitLogin(){
  const d=S.draft, name=(d.name||"").trim(), email=(d.email||"").trim();
  if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMsg("err","errLogin");return}
  store.lastUser={name,email,lang:d.lang||"fr"};lang=store.lastUser.lang;persist();go("home");
}
function submitProject(){
  const d=S.draft;
  if(!(d.client||"").trim()||!(d.nom||"").trim()){setMsg("err","errProject");return}
  if(store.projet){S.overlay={kind:"replace"};render();return}
  createProject();
}
function createProject(){
  const d=S.draft;
  store.projet={client:d.client.trim(),responsable:(d.responsable||"").trim(),nom:d.nom.trim(),date:d.date||todayISO(),pieces:[]};
  persist();go("project");
}
function submitPiece(){
  const d=Object.assign({},S.draft);
  if(!d.procedeId){setMsg("err","errProc");return}
  if(!(pos(d.qteRequise)>0)){setMsg("err","errQty");return}
  const res=pricePiece(d,store);
  if(!res.ok){setMsg("err",res.err);return}
  const keys=["sys","numClient","numDie","nom","qteRequise","procedeId","longueur","surface","poids","perimetre","qteBassin","matPrix","matId"];
  const clean={};keys.forEach(k=>clean[k]=typeof d[k]==="string"?d[k].trim():d[k]);
  if(S.editId){const i=store.projet.pieces.findIndex(x=>x.id===S.editId);if(i>=0)store.projet.pieces[i]=Object.assign({id:S.editId},clean)}
  else store.projet.pieces.push(Object.assign({id:uid()},clean));
  persist();go("project",{editId:null});
}
/* Dès qu'on quitte le champ « Numéro de pièce du client » : si le numéro existe dans le Matériel, on remplit la pièce */
const normNum=v=>String(v||"").trim().toLowerCase();
function lookupMat(){
  const d=S.draft, key=normNum(d.numClient);
  const m=key?store.materiel.find(x=>normNum(x.num)===key):null;
  if(m){
    ["numDie","sys","longueur","surface","poids","perimetre","qteBassin"].forEach(k=>{d[k]=m[k]===undefined?"":m[k]});
    d.nom=m.desc||"";d.matPrix=m.prix;d.matId=m.id;S.fromMat=true;S.msg=null;
  }else if(d.matId){d.matPrix="";d.matId="";S.fromMat=false}
}
function refreshPiece(){
  const d=S.draft, met=d.sys==="met", u=t("u");
  ["numClient","numDie","nom","qteRequise","longueur","surface","poids","perimetre","qteBassin"].forEach(k=>{const el=document.getElementById("f-"+k);if(el&&el.value!==(d[k]==null?"":String(d[k])))el.value=d[k]==null?"":d[k]});
  const sel=document.getElementById("f-procedeId");if(sel&&d.procedeId!=null)sel.value=d.procedeId;
  document.querySelectorAll('[data-act="sys"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===d.sys)));
  const units={longueur:met?u.m:u.ft,surface:met?u.m2:u.ft2,poids:met?u.kgm:u.lbft,perimetre:met?u.mm:u.in};
  for(const k in units){const b=document.getElementById("u-"+k);if(b)b.textContent=units[k]}
  const bn=document.getElementById("mat-banner");if(bn)bn.innerHTML=pieceBanner();
  const pb=document.getElementById("price-box");if(pb)pb.innerHTML=pieceBox(d);
}
function submitMat(){
  const d=S.draft;
  if(!(d.num||"").trim()||!(d.desc||"").trim()||!(num(d.prix)>0)){setMsg("err","errMat");return}
  const dup=store.materiel.find(x=>normNum(x.num)===normNum(d.num)&&x.id!==S.editId);
  if(dup){setMsg("err","errMatDup");return}
  const keys=["num","numDie","desc","sys","longueur","surface","poids","perimetre","qteBassin","prix"];
  const rec={};keys.forEach(k=>rec[k]=typeof d[k]==="string"?d[k].trim():d[k]);
  if(S.editId){const i=store.materiel.findIndex(x=>x.id===S.editId);if(i>=0)store.materiel[i]=Object.assign({id:S.editId},rec)}
  else store.materiel.push(Object.assign({id:uid()},rec));
  persist();go("mats",{editId:null});
}
function submitProc(){
  const d=S.draft;
  if(!(d.nom||"").trim()){setMsg("err","errProcName");return}
  const rec={nom:d.nom.trim(),prixNormal:(d.prixNormal||"").trim(),prixPi2:(d.prixPi2||"").trim()};
  if(S.editId){const i=store.procedes.findIndex(x=>x.id===S.editId);if(i>=0)store.procedes[i]=Object.assign({id:S.editId},rec)}
  else store.procedes.push(Object.assign({id:uid()},rec));
  persist();S.draft={};S.editId=null;S.msg=null;render();
}
function submitExtra(){
  const d=S.draft;
  const okVals=num(d.a)!==null&&(d.cond!=="entre"||num(d.b)!==null);
  if(!(d.nom||"").trim()||!okVals||num(d.montant)===null){setMsg("err","errExtra");return}
  const rec={nom:d.nom.trim(),critere:d.critere,cond:d.cond,a:d.a,b:d.cond==="entre"?d.b:"",mode:d.mode,montant:d.montant};
  if(S.editId){const i=store.extras.findIndex(x=>x.id===S.editId);if(i>=0)store.extras[i]=Object.assign({id:S.editId},rec)}
  else store.extras.push(Object.assign({id:uid()},rec));
  persist();go("rules",{editId:null});
}

/* ================= ENVOI DE FICHIERS ================= */
/* Dans Claude : capacité "downloads" (ouvre le menu de partage sur iPhone). Hors de Claude (app installée) : menu de partage du téléphone, sinon téléchargement. */
async function deliverFile(blob,filename,mime,title,text){
  if(caps.downloads){
    try{await caps.downloads.save({filename,data:blob});return "ok"}
    catch(err){return err&&err.code==="declined"?"declined":"unavailable"}
  }
  try{
    const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      const data={files:[file]};if(title)data.title=title;if(text)data.text=text;
      await navigator.share(data);return "ok";
    }
  }catch(err){if(err&&err.name==="AbortError")return "declined"}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);return "ok";
  }catch(err){return "unavailable"}
}

async function saveBackup(){
  const data=JSON.stringify({type:"masSoumission",v:1,procedes:store.procedes,regles:store.regles,extras:store.extras,materiel:store.materiel},null,2);
  const res=await deliverFile(new Blob([data],{type:"application/json"}),"sauvegarde-soumission-"+todayISO()+".json","application/json");

function restoreBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const s=JSON.parse(fr.result);if(s.type!=="masSoumission"||!Array.isArray(s.procedes))throw 0;
    store.procedes=s.procedes;store.extras=Array.isArray(s.extras)?s.extras:[];store.materiel=Array.isArray(s.materiel)?s.materiel:[];store.regles=Object.assign(defaultStore().regles,s.regles||{});persist();setMsg("ok","restored")}
    catch(e){setMsg("err","restoreFail")}};
  fr.readAsText(file);
}

/* ================= PDF ================= */
const pdfSafe=s=>String(s===null||s===undefined?"":s).replace(/[   ]/g," ").replace(/[–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/…/g,"...").replace(/→/g,">");
function calcLine(res,L,dispMet){
  if(res.kind==="none")return `(${t("calcMat",L)} ${money(res.matPrice,L)} ; ${t("calcNoProc",L)})`;
  const inner=calcProcLine(res,L,dispMet);
  if(res.matPrice>0)return `(${t("calcMat",L)} ${money(res.matPrice,L)} + ${t("calcProc",L)} ${inner.slice(1,-1)}) = ${money(res.price,L)}`;
  return inner;
}
function calcProcLine(res,L,dispMet){
  const u=t("u",L);
  const m=v=>money(v,L,4);
  if(res.kind==="feuille"){
    const S2=dispMet?res.S/FT2_PER_M2:res.S;
    let s=`(${m(res.pp)} × ${fmt(res.S,0,4,L)} ${u.ft2} = ${money(res.rounded,L)}`;
    if(dispMet)s=`(${m(res.pp)} × ${fmt(res.S,0,4,L)} ${u.ft2} [${fmt(S2,0,4,L)} ${u.m2}] = ${money(res.rounded,L)}`;
    if(res.minKind)s+=` ; ${t("calcMinPiece",L)} ${money(res.minVal,L)}`;
    return s+")";
  }
  let s=`(${m(res.pn)} × ${fmt(res.perimUsed,0,4,L)} ${u.in}`;
  if(res.perimMinApplied)s+=` [${t("calcPerimMin",L)} ${fmt(res.perimOrig,0,4,L)} ${u.in}]`;
  s+=` × ${fmt(res.L,0,4,L)} ${u.ft}`;
  if(res.applied.length){
    s+=` = ${money(res.base,L,4)}`;
    for(const x of res.applied){s+=x.mode==="pct"?` + ${fmt(x.montant,0,4,L)} %`:` + ${money(x.montant,L,4)}`;s+=` [${x.nom}]`}
  }
  s+=` = ${money(res.rounded,L)}`;
  if(res.minKind==="piece")s+=` ; ${t("calcMinPiece",L)} ${money(res.minVal,L)}`;
  if(res.minKind==="tank")s+=` ; ${t("calcMinTank",L)} ${money(res.minProc,L)} ÷ ${fmt(res.tank,0,4,L)} = ${money(res.minVal,L)}`;
  return s+")";
}
async function makePdf(){
  const L=S.exp.lang, mode=S.exp.mode, dispMet=mode==="m";
  if(!window.jspdf||!window.jspdf.jsPDF){setMsg("err","pdfLibMissing");return}
  const rep=buildReport(store);
  if(!rep.groups.length){setMsg("err","noPiecesExport");return}
  S.busy=true;render();
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=36, TOP=104;
    const u=t("u",L), p=store.projet;
    const modeLbl={piece:t("perPieceShort",L),ft:t("perFtShort",L),m:t("perMShort",L)}[mode];
    const priceHdr=t("colPrice",L)+(mode==="ft"?` ($/${u.ft})`:mode==="m"?` ($/${u.m})`:"");
    const head=[[t("colNum",L),t("colName",L),t("colDie",L),`${t("colPerim",L)} (${dispMet?u.mm:u.in})`,`${t("colWeight",L)} (${dispMet?u.kgm:u.lbft})`,`${t("colLength",L)} (${dispMet?u.m:u.ft})`,`${t("colSurface",L)} (${dispMet?u.m2:u.ft2})`,t("colTank",L),t("colQty",L),priceHdr,t("colSub",L)].map(pdfSafe)];
    let y=TOP;
    for(const g of rep.groups){
      if(y>H-140){doc.addPage();y=TOP}
      doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(27,31,36);
      const gName=g.none?t("noProcessOpt",L):g.proc.nom;
      doc.text(pdfSafe(gName),M,y);y+=6;
      const body=[];
      for(const it of g.items){
        const pc=it.p,res=it.res,c=res.c;
        const isExt=res.kind==="extrusion"||(res.kind==="none"&&c.L!==null&&c.L>0);
        const per=isExt&&c.P!==null&&c.P>0?(dispMet?fmt(c.P*25.4,0,2,L):fmt(c.P,0,4,L)):"-";
        const wt=c.W!==null?(dispMet?fmt(c.W/LBFT_PER_KGM,0,4,L):fmt(c.W,0,4,L)):"-";
        const len=isExt?(dispMet?fmt(c.L/FT_PER_M,0,4,L):fmt(c.L,0,4,L)):"-";
        const sur=(!isExt&&c.S!==null&&c.S>0)?(dispMet?fmt(c.S/FT2_PER_M2,0,4,L):fmt(c.S,0,4,L)):"-";
        let unitShown=money(res.price,L);
        if(isExt&&mode==="ft")unitShown=money(roundCents(res.price/c.L),L);
        if(isExt&&mode==="m")unitShown=money(roundCents(res.price/(c.L/FT_PER_M)),L);
        body.push([pc.numClient||"-",pc.nom||"-",pc.numDie||"-",per,wt,len,sur,pos(pc.qteBassin)?fmt(pos(pc.qteBassin),0,0,L):"-",fmt(num(pc.qteRequise),0,2,L),unitShown,money(it.line,L)].map(pdfSafe));
        body.push([{content:pdfSafe(calcLine(res,L,dispMet)),colSpan:11,styles:{fontSize:7.5,textColor:[74,81,89],fontStyle:"normal",halign:"left",cellPadding:{top:0,bottom:5,left:5,right:5},lineWidth:0}}]);
      }
      doc.autoTable({head,body,startY:y,margin:{left:M,right:M,top:TOP},theme:"plain",
        styles:{font:"helvetica",fontSize:8.5,textColor:[27,31,36],cellPadding:{top:4,bottom:1,left:5,right:5},valign:"middle"},
        headStyles:{fillColor:[236,237,238],fontStyle:"bold",lineWidth:0.6,lineColor:[201,205,209],halign:"left"},
        columnStyles:{3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right",fontStyle:"bold"},9:{halign:"right",fontStyle:"bold"},10:{halign:"right",fontStyle:"bold"}},
        didParseCell:(h)=>{if(h.section==="head"&&h.column.index>=3)h.cell.styles.halign="right";if(h.section==="body"&&h.row.raw.length===11){h.cell.styles.lineWidth={top:0.6};h.cell.styles.lineColor=[201,205,209]}},
      });
      y=doc.lastAutoTable.finalY+14;
      const rows=[[t("subtotal",L),money(g.sub,L),false]];
      if(g.lot>0)rows.push([`${t("lotMin",L)} (${t("minimumOf",L)} ${money(pos(store.regles.minProcede),L)})`,money(g.lot,L),false]);
      rows.push([`${t("total",L)} ${gName}`,money(g.total,L),true]);
      if(y+rows.length*14>H-40){doc.addPage();y=TOP}
      doc.setDrawColor(27,31,36);doc.setLineWidth(1.2);doc.line(W-M-260,y-10,W-M,y-10);
      for(const [l,v,b] of rows){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(b?10.5:9.5);doc.text(pdfSafe(l),W-M-110,y,{align:"right"});doc.text(pdfSafe(v),W-M,y,{align:"right"});y+=14}
      y+=16;
    }
    if(y>H-60){doc.addPage();y=TOP}
    doc.setFillColor(27,31,36);doc.roundedRect(W-M-300,y-14,300,26,4,4,"F");
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text(pdfSafe(t("grandTotal",L)),W-M-286,y+3);doc.text(pdfSafe(money(rep.grand,L)),W-M-14,y+3,{align:"right"});
    if(rep.groups.some(g=>g.items.some(i=>i.res.kind==="feuille"))&&mode!=="piece"){doc.setTextColor(74,81,89);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(pdfSafe(t("sheetsPerPiece",L)),M,y+3)}
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i);
      doc.addImage(LOGO_L,"PNG",M,34,180,35);
      doc.setTextColor(27,31,36);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(pdfSafe(t("pdfTitle",L)),M+200,48);
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(74,81,89);doc.text(pdfSafe(`${t("pricesShown",L)} : ${modeLbl}`),M+200,62);
      const info=[[t("client",L),p.client],[t("projectName",L),p.nom],[t("date",L),fmtDate(p.date,L)],[t("preparedBy",L),store.lastUser.name],[t("email",L),store.lastUser.email]];
      let iy=34;for(const [k,v] of info){doc.setFont("helvetica","normal");doc.setTextColor(74,81,89);doc.text(pdfSafe(k),W-M-200,iy);doc.setFont("helvetica","bold");doc.setTextColor(27,31,36);doc.text(pdfSafe(v||"-"),W-M-130,iy);iy+=11}
      doc.setDrawColor(27,31,36);doc.setLineWidth(1.6);doc.line(M,88,W-M,88);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(74,81,89);doc.text(pdfSafe(`${t("page",L)} ${i} / ${n}`),W-M,H-18,{align:"right"});
    }
    const blob=doc.output("blob");
    const fname=pdfSafe(`${t("pdfTitle",L)} - ${p.client} - ${p.nom}.pdf`).replace(/[\\/:*?"<>|]/g,"-");
    const subject=`${t("emailSubject",L)} - ${p.client} - ${p.nom}`;
    const res=await deliverFile(blob,fname,"application/pdf",subject,t("emailBody",L));
    S.busy=false;
    if(res==="ok")setMsg("ok","pdfOk");else if(res==="declined")setMsg("info","pdfDeclined");else setMsg("err","pdfUnavail");
  }catch(err){S.busy=false;setMsg("err","pdfFail")}
}
